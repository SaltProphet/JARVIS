<!doctype html><meta charset="utf-8"><title>JARVIS template upload</title><style>body{font:16px system-ui;max-width:700px;margin:10vh auto;background:#061016;color:#dce9ee;padding:24px}label{display:block;border:1px dashed #67e8d1;padding:50px;text-align:center}#status{margin-top:20px}</style><h1>Receive the dashboard template</h1><label>Choose files<input id="files" type="file" multiple accept=".html,.png,.jpg,.jpeg,.webp,.svg"></label><div id="status"></div><script>files.onchange=async()=>{for(const f of files.files){const r=await new Promise((ok,no)=>{const x=new FileReader;x.onload=()=>ok(x.result);x.onerror=no;x.readAsDataURL(f)});const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,data:r})});status.innerHTML+=`<p>${f.name}: ${res.ok?'saved':'failed'}</p>`}}</script>
