<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Mission Control Template</title>
  <link rel="icon" href="/favicon.svg">
  <script>
    window.__PORTRAITS__ = {default: 'JV', dev: 'DV', research: 'RS', assistant: 'AS'};
    window.__AV__ = window.__PORTRAITS__;
    function AV(key) { return window.__AV__[key] || '?'; }
  </script>
  <style>
    :root{color-scheme:dark;--ink:#dce9ee;--muted:#78909a;--line:#20353d;--glow:#67e8d1}
    *{box-sizing:border-box}body{margin:0;background:#061016;color:var(--ink);font:14px system-ui,sans-serif}
    header{display:flex;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);font:11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}
    .brand{color:var(--glow);font-size:18px}main{max-width:1280px;margin:auto;padding:28px 24px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 13px}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:#0b171d;border:1px solid var(--line);padding:20px;min-height:150px}
    .hero{min-height:330px;display:grid;place-items:center;text-align:center}.orb{width:180px;height:180px;border-radius:50%;border:1px solid var(--glow);display:grid;place-items:center;color:var(--glow);font:42px ui-monospace,monospace}
    .view{display:none}.view.active{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:18px 14px}}
  </style>
  <script>
    /* ==================== TEMPLATE SHIM START ==================== */
    window.__TEMPLATE__=true;
    const DEMO_STATE={crew:[],ops:[],gateway:{state:'template'},version:'v0.1'};
    const originalFetch=window.fetch;
    window.fetch=async()=>({ok:true,json:async()=>DEMO_STATE,text:async()=>''});
    window.EventSource=class{addEventListener(){}};
    /* ==================== TEMPLATE SHIM END ==================== */
  </script>
</head>
<body>
  <header><div class="brand">JARVIS / MISSION CONTROL</div><div>UPLINK <span id="gateway">TEMPLATE</span></div></header>
  <main>
    <nav class="tabs"><button data-view="home">HOME</button><button data-view="agents">AGENTS</button><button data-view="comms">COMMS</button><button data-view="schedule">SCHEDULE</button><button data-view="library">LIBRARY</button><button data-view="docs">DOCS</button><button data-view="control">CONTROL</button></nav>
    <section id="home" class="view active"><div class="grid"><div class="card hero"><div class="orb">JV</div></div><div class="card">Original design template</div></div></section>
    <section id="agents" class="view"><div class="card">Crew dossier template</div></section>
    <section id="comms" class="view"><div class="card">Conversation template</div></section>
    <section id="schedule" class="view"><div class="card">Schedule template</div></section>
    <section id="library" class="view"><div class="card">Library template</div></section>
    <section id="docs" class="view"><div class="card">Manual template</div></section>
    <section id="control" class="view"><div class="card">Control template</div></section>
  </main>
  <script id="docs-seed">Operate from the seven tabs. Home is the live pulse. Comms is explicit-send only.</script>
  <script>
    fetch('/api/state').then(response => response.json()).then(state => {
      document.getElementById('gateway').textContent = state.gateway.state.toUpperCase();
    });
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(button.dataset.view).classList.add('active');
    }));
  </script>
</body>
</html>
